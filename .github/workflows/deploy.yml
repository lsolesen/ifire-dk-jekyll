name: deploy

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master
  workflow_dispatch:

env:
  RUBY_VERSION: "3.3"

# Avoid overlapping Pages deployments
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: 🛎 Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: ⚡️ Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats build-essential ca-certificates curl make shellcheck libgsl-dev libffi-dev minify liblapacke-dev libopenblas-dev

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: ⚡️ Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ hashFiles('**/package-lock.json') }}

      - name: ⚡️ Install npm dependencies
        continue-on-error: true
        run: |
          npm install

      - name: Checking Jekyll configuration
        run: bundle exec jekyll doctor

      - name: 🔨 Build site
        run: |
          bundle exec jekyll build --lsi --profile
        env:
          JEKYLL_ENV: production

      #- name: Optimize
      #  run: |
      #    minify -r -o _site/ --html-keep-document-tags --html-keep-end-tags --html-keep-default-attrvals --html-keep-whitespace --verbose _site

      - name: 📦 Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site/"

      - name: Cache Jekyll site
        uses: actions/cache@v4
        with:
          path: "_site/"
          key: ${{ runner.os }}-${{ github.sha }}

  deploy:
    if: github.event_name == 'push'
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🎉 Deploy to GitHub Pages 🎊
        id: deployment
        uses: actions/deploy-pages@v4

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Use cache
        uses: actions/cache@v4
        with:
          path: "_site/"
          key: ${{ runner.os }}-${{ github.sha }}

      - name: ⚡️ Cache HTMLProofer
        id: cache-htmlproofer
        uses: actions/cache@v4
        with:
          path: tmp/.htmlproofer
          key: ${{ runner.os }}-htmlproofer

      - name: 📉 Check HTML
        uses: chabad360/htmlproofer@master
        with:
          directory: "./_site"
          arguments: |
            --only-4xx
            --ignore-status-codes "400,403,409,429"
            --ignore-empty-alt
            --allow-hash-href
            --no-enforce-https
            --ignore-urls "/bjsm.bmj.com/, /mademistakes.com/, /www.t-nation.com/"